name: "Bug report"
description: Report an error or unexpected behaviour in AI Manager.
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Before you start
      options:
        - label: I have read the README and SUPPORT.md.
          required: true
        - label: I have searched open and closed issues for this problem.
          required: true
        - label: I have removed API keys, tokens, file contents, and private logs from this report.
          required: true

  - type: input
    attributes:
      label: AI Manager version
      description: Copy the exact value shown in Settings.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating system
      multiple: false
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows x64
        - Linux x64
        - Other or unsupported platform
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area
      description: Where in AI Manager does the problem appear?
      multiple: false
      options:
        - Home or Quick Check
        - AI Tools
        - AI Services
        - Extensions (Skills, MCP, Prompts)
        - Local Data
        - Settings
        - Installation or updater
        - Other
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Tool or desktop app involved
      multiple: true
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Gemini CLI
        - Grok Build
        - OpenClaw
        - Hermes
        - Pi
        - Kimi Code
        - DeepSeek Harness (DSH)
        - Codex App
        - Claude Desktop
        - Cursor
        - ZCode
        - Cherry Studio
        - None / not tool-specific
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Screenshots help. Paste logs only after redacting them.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behaviour
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Anything else that helps, such as the tool version, how the tool was installed (npm, pnpm, bun, Volta, native installer), or a redacted log excerpt.
    validations:
      required: false
